name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Copy dist into desktop wwwroot
        run: node scripts/copy-dist.mjs

      - name: Publish desktop (single-file exe)
        run: dotnet publish desktop/LocalTapCompatible.csproj -c Release -o release --nologo

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/LocalTapCompatible.exe
          generate_release_notes: true
