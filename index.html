<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TapNow Local — 本地 AI 画布</title>
  <script>
  (function () {
    function showFatal(text) {
      try {
        var el = document.getElementById('fatal-error');
        if (!el) {
          el = document.createElement('div');
          el.id = 'fatal-error';
          el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:8px;font:12px monospace;white-space:pre-wrap;word-break:break-all;box-shadow:0 4px 20px rgba(0,0,0,.5);max-height:40vh;overflow:auto';
          document.body.appendChild(el);
        }
        el.textContent = '页面错误：' + text;
      } catch (_) {}
    }
    window.addEventListener('error', function (e) {
      showFatal((e.message || String(e.error)) + (e.filename ? '  ' + e.filename + (e.lineno ? ':' + e.lineno : '') : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      showFatal((e.reason && (e.reason.message || e.reason)) || '未处理 Promise 异常');
    });
  })();
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
