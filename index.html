<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="local-tap-compatible — a local infinite-canvas node-based AI workflow. Bring your own API keys for image, video and reverse-prompt generation — nothing leaves your machine." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d1020" />
    <meta property="og:title" content="local-tap-compatible — Local AI Infinite Canvas" />
    <meta property="og:description" content="Node-based AI workflow on an infinite canvas. BYO API keys — image, video, reverse prompt. Runs fully local." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/jsxxwhai/localtapcompatible" />
    <meta name="twitter:card" content="summary" />
    <title>local-tap-compatible</title>
  <script>
  (function () {
    try {
      var nav = (navigator.language || 'en').toLowerCase();
      var lang = nav.indexOf('zh') === 0 ? 'zh' : (nav.indexOf('ja') === 0 ? 'ja' : (nav.indexOf('ko') === 0 ? 'ko' : 'en'));
      var title = { zh: 'local-tap-compatible — 本地 AI 无限画布', en: 'local-tap-compatible — Local AI Infinite Canvas', ja: 'local-tap-compatible — ローカル AI 無限キャンバス', ko: 'local-tap-compatible — 로컬 AI 무한 캔버스' }[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
      if (title) document.title = title;
    } catch (_) {}
  })();
</script>
  <script>
  (function () {
    function showFatal(text) {
      try {
        var el = document.getElementById('fatal-error');
        if (!el) {
          el = document.createElement('div');
          el.id = 'fatal-error';
          el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:8px;font:12px monospace;white-space:pre-wrap;word-break:break-all;box-shadow:0 4px 20px rgba(0,0,0,.5);max-height:40vh;overflow:auto';
          document.body.appendChild(el);
        }
        el.textContent = fatalText('title', 'Page error: ') + text;
      } catch (_) {}
    }
    function fatalText(key, fallback) {
      try {
        var nav = (navigator.language || 'zh').toLowerCase();
        var lang = nav.indexOf('zh') === 0 ? 'zh' : (nav.indexOf('ja') === 0 ? 'ja' : (nav.indexOf('ko') === 0 ? 'ko' : 'en'));
        var dict = {
          zh: { title: '页面错误：', unhandled: '未处理 Promise 异常' },
          en: { title: 'Page error: ', unhandled: 'Unhandled promise rejection' },
          ja: { title: 'ページエラー：', unhandled: '未処理の Promise 例外' },
          ko: { title: '페이지 오류：', unhandled: '처리되지 않은 Promise 예외' }
        };
        return dict[lang][key] || fallback;
      } catch (_) { return fallback; }
    }
    window.addEventListener('error', function (e) {
      showFatal((e.message || String(e.error)) + (e.filename ? '  ' + e.filename + (e.lineno ? ':' + e.lineno : '') : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      showFatal((e.reason && (e.reason.message || e.reason)) || fatalText('unhandled', 'Unhandled promise rejection'));
    });
  })();
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
